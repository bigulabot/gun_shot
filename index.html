<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10202c" />
    <meta name="description" content="Ozo the toucan's run-and-gun platformer. Prototype." />
    <title>Gun Shot</title>
    <!-- Icon Ozo uses everywhere: browser tab, "Add to Home Screen" on phones/tablets, and PWA installs. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Gun Shot" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <main id="stage" data-mode="loading" aria-label="Gun Shot game">
      <div id="game"></div>
      <header id="hud" class="hud" hidden>
        <div class="hud-group">
          <span id="hearts" class="hearts" aria-label="3 hearts"></span>
          <span class="level-label"><b id="level-name"></b> <span id="objective"></span></span>
        </div>
        <div class="hud-group">
          <span class="wallet research" title="Research">◆ <b id="research-count">0</b></span>
          <span class="wallet coins" title="Gun coins">● <b id="coin-count">0</b></span>
          <button id="pause" class="icon-button" aria-label="Pause game"></button>
        </div>
      </header>
      <div id="level-progress" class="level-progress" hidden><div id="progress-fill"></div></div>
      <div id="controls" class="controls" hidden>
        <!-- Touch anywhere on the left half: the stick appears under your thumb. -->
        <div id="move-zone" class="touch-zone move-zone">
          <div id="stick" class="stick" aria-label="Move: drag left or right"><div class="stick-knob"></div></div>
        </div>
        <!-- Right half: each finger presses the nearest button, and can slide between them. -->
        <div id="action-zone" class="touch-zone action-zone">
          <div class="control-group">
            <button data-control="dash" class="control" aria-label="Dash" hidden></button>
            <button data-control="jump" class="control" aria-label="Jump"></button>
            <button data-control="shoot" class="control big" aria-label="Shoot"></button>
          </div>
        </div>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="overlay" class="overlay"><p>Loading…</p></div>
      <div class="utility">
        <button id="sound" class="icon-button" aria-label="Mute sound"></button>
        <button id="fullscreen" class="icon-button" aria-label="Enter fullscreen"></button>
      </div>
    </main>
    <!-- Shown only on touch screens held upright (see style.css). -->
    <p class="rotate-hint" aria-hidden="true">↻ Turn your device sideways to play</p>
    <noscript><p>Please enable JavaScript to play Gun Shot.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
